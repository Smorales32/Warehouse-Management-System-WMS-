# ============================================================
# COMPLETE PICK
# ============================================================

mutation ProcessCompletePick(
  $jobId: UUID!
  $requestedQuantity: Int!
) @auth(level: USER) @transaction {

  query
  @check(
    expr: "response.query.job != null"
    message: "Job was not found."
  )
  @check(
    expr: "response.query.job.status == 'Open'"
    message: "Job is not open."
  )
  @check(
    expr: "vars.requestedQuantity > 0"
    message: "Pick quantity must be greater than zero."
  )
  @check(
    expr: "response.query.job.pickedQuantity + vars.requestedQuantity == response.query.job.requiredQuantity"
    message: "Pick quantity does not complete the job."
  )
  @check(
    expr: "response.query.job.inventoryItem.quantity >= vars.requestedQuantity"
    message: "Insufficient inventory."
  )
  @check(
    expr: "response.query.users.size() == 1"
    message: "Authenticated WMS user was not found."
  ) {
    job(
      id: $jobId
    ) {
      id
      pickedQuantity
      requiredQuantity
      status

      inventoryItem {
        id
        quantity
      }
    }

    users(
      where: {
        authReference: { eq_expr: "auth.uid" }
      }
    ) {
      id
    }
  }

  job_update(
    id: $jobId
    data: {
      pickedQuantity_update: {
        inc: $requestedQuantity
      }
      status: "Complete"
      updatedDate_expr: "request.time"
    }
  )

  inventory_update(
    key: {
      id_expr: "response.query.job.inventoryItem.id"
    }
    data: {
      quantity_update: {
        dec: $requestedQuantity
      }
      updatedDate_expr: "request.time"
    }
  )

  inventoryTransaction_insert(
    data: {
      inventoryItemId_expr: "response.query.job.inventoryItem.id"
      jobId: $jobId
      userId_expr: "response.query.users[0].id"
      transactionType: "Pick"
      quantity: $requestedQuantity
      previousQuantity_expr: "response.query.job.inventoryItem.quantity"
      newQuantity_expr: "response.query.job.inventoryItem.quantity - vars.requestedQuantity"
      reason: "Completed pick"
    }
  )
}


# ============================================================
# ADJUST INVENTORY
# ============================================================

mutation AdjustInventory(
  $inventoryId: UUID!
  $newQuantity: Int!
  $reason: String!
) @auth(level: USER) @transaction {

  query
  @check(
    expr: "response.query.inventory != null"
    message: "Inventory item was not found."
  )
  @check(
    expr: "vars.newQuantity >= 0"
    message: "Inventory quantity cannot be negative."
  )
  @check(
    expr: "response.query.users.size() == 1"
    message: "Authenticated WMS user was not found."
  ) {
    inventory(
      id: $inventoryId
    ) {
      id
      quantity
    }

    users(
      where: {
        authReference: { eq_expr: "auth.uid" }
      }
    ) {
      id
    }
  }

  inventory_update(
    id: $inventoryId
    data: {
      quantity: $newQuantity
      updatedDate_expr: "request.time"
    }
  )

  inventoryTransaction_insert(
    data: {
      inventoryItemId: $inventoryId
      userId_expr: "response.query.users[0].id"
      transactionType: "Adjustment"
      quantity_expr: "vars.newQuantity - response.query.inventory.quantity"
      previousQuantity_expr: "response.query.inventory.quantity"
      newQuantity: $newQuantity
      reason: $reason
    }
  )
}


# ============================================================
# TRANSACTION HISTORY
# ============================================================

query GetInventoryTransactions @auth(level: USER) {

  inventoryTransactions(
    orderBy: [
      { createdDate: DESC }
    ]
  ) {
    id

    inventoryItem {
      id
      resinName
      sku
      warehouseLocation
    }

    job {
      id
      jobNumber
    }

    user {
      id
      username
      role
    }

    transactionType
    quantity
    previousQuantity
    newQuantity
    reason
    createdDate
  }
}