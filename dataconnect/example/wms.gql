# ============================================================
# WMS APP - FIREBASE SQL CONNECT OPERATIONS
# ============================================================


# ============================================================
# USER
# ============================================================

mutation CreateUser(
  $username: String!
) @auth(level: USER) {
  user_insert(
    data: {
      username: $username
      authReference_expr: "auth.uid"
      role: "warehouse_user"
    }
  )
}

query GetCurrentUser @auth(level: USER) {
  users(
    where: {
      authReference: { eq_expr: "auth.uid" }
    }
  ) {
    id
    username
    role
    createdDate
  }
}


# ============================================================
# INVENTORY SEARCH
# ============================================================

query GetInventoryBySearch(
  $search: String!
) @auth(level: USER) {
  inventories(
    where: {
      _or: [
        { resinName: { contains: $search } }
        { sku: { contains: $search } }
        { warehouseLocation: { contains: $search } }
      ]
    }
  ) {
    id
    resinName
    sku
    warehouseLocation
    quantity
    createdDate
    updatedDate
  }
}


# ============================================================
# RECEIVE NEW INVENTORY
# ============================================================

query GetAllInventory @auth(
  level: USER
  insecureReason: "Authenticated WMS users need to view shared warehouse inventory."
) {
  inventories(
    orderBy: [
      { resinName: ASC }
    ]
  ) {
    id
    resinName
    sku
    warehouseLocation
    quantity
    createdDate
    updatedDate
  }
}



mutation ReceiveNewInventory(
  $resinName: String!
  $sku: String!
  $warehouseLocation: String!
  $quantity: Int!
) @auth(level: USER) @transaction {

  query
  @check(
    expr: "vars.quantity > 0"
    message: "Quantity must be greater than zero."
  )
  @check(
    expr: "response.query.users.size() == 1"
    message: "Authenticated WMS user was not found."
  ) {
    users(
      where: {
        authReference: { eq_expr: "auth.uid" }
      }
    ) {
      id
    }
  }

  inv: inventory_insert(
    data: {
      resinName: $resinName
      sku: $sku
      warehouseLocation: $warehouseLocation
      quantity: $quantity
    }
  )

  inventoryTransaction_insert(
    data: {
      inventoryItemId_expr: "response.inv.id"
      userId_expr: "response.query.users[0].id"
      transactionType: "Receive"
      quantity: $quantity
      previousQuantity: 0
      newQuantity: $quantity
      reason: "Initial inventory receipt"
    }
  )
}


# ============================================================
# RECEIVE EXISTING INVENTORY
# ============================================================

mutation ReceiveExistingInventory(
  $inventoryId: UUID!
  $quantity: Int!
) @auth(level: USER) @transaction {

  query
  @check(
    expr: "response.query.inventory != null"
    message: "Inventory item was not found."
  )
  @check(
    expr: "vars.quantity > 0"
    message: "Quantity must be greater than zero."
  )
  @check(
    expr: "response.query.users.size() == 1"
    message: "Authenticated WMS user was not found."
  ) {
    inventory(
      id: $inventoryId
    ) {
      id
      quantity
    }

    users(
      where: {
        authReference: { eq_expr: "auth.uid" }
      }
    ) {
      id
    }
  }

  inventory_update(
    id: $inventoryId
    data: {
      quantity_update: {
        inc: $quantity
      }
      updatedDate_expr: "request.time"
    }
  )

  inventoryTransaction_insert(
    data: {
      inventoryItemId: $inventoryId
      userId_expr: "response.query.users[0].id"
      transactionType: "Receive"
      quantity: $quantity
      previousQuantity_expr: "response.query.inventory.quantity"
      newQuantity_expr: "response.query.inventory.quantity + vars.quantity"
      reason: "Inventory receipt"
    }
  )
}


# ============================================================
# CREATE JOB
# ============================================================

mutation CreateJob(
  $jobNumber: String!
  $inventoryItemId: UUID!
  $requiredQuantity: Int!
) @auth(level: USER) {

  job_insert(
    data: {
      jobNumber: $jobNumber
      inventoryItemId: $inventoryItemId
      requiredQuantity: $requiredQuantity
      pickedQuantity: 0
      status: "Open"
    }
  )
}


# ============================================================
# GET JOB BY NUMBER
# ============================================================

query GetJobByNumber(
  $jobNumber: String!
) @auth(level: USER) {

  jobs(
    where: {
      jobNumber: { eq: $jobNumber }
    }
  ) {
    id
    jobNumber
    inventoryItem {
      id
      resinName
      sku
      warehouseLocation
      quantity
    }
    requiredQuantity
    pickedQuantity
    status
    createdDate
    updatedDate
  }
}


# ============================================================
# GET ALL JOBS
# ============================================================

query GetAllJobs @auth(level: USER) {

  jobs(
    orderBy: [
      { createdDate: DESC }
    ]
  ) {
    id
    jobNumber
    inventoryItem {
      id
      resinName
      sku
      warehouseLocation
    }
    requiredQuantity
    pickedQuantity
    status
    createdDate
    updatedDate
  }
}


# ============================================================
# SHORT PICK
# ============================================================

mutation RecordShortPick(
  $jobId: UUID!
  $quantity: Int!
) @auth(level: USER) @transaction {

  query
  @check(
    expr: "response.query.job != null"
    message: "Job was not found."
  )
  @check(
    expr: "response.query.users.size() == 1"
    message: "Authenticated WMS user was not found."
  )
  @check(
    expr: "vars.quantity > 0"
    message: "Pick quantity must be greater than zero."
  ) {
    job(
      id: $jobId
    ) {
      id
      pickedQuantity
      requiredQuantity
      status
      inventoryItem {
        id
        quantity
      }
    }

    users(
      where: {
        authReference: { eq_expr: "auth.uid" }
      }
    ) {
      id
    }
  }

  job_update(
    id: $jobId
    data: {
      pickedQuantity_update: {
        inc: $quantity
      }
      status: "Short Pick"
      updatedDate_expr: "request.time"
    }
  )

  inventoryTransaction_insert(
    data: {
      inventoryItemId_expr: "response.query.job.inventoryItem.id"
      jobId: $jobId
      userId_expr: "response.query.users[0].id"
      transactionType: "ShortPick"
      quantity: $quantity
      previousQuantity_expr: "response.query.job.inventoryItem.quantity"
      newQuantity_expr: "response.query.job.inventoryItem.quantity"
      reason: "Short pick"
    }
  )
}


